<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1150" width="100%" height="100%" style="background:#0f172a; font-family:'Segoe UI',Roboto,Helvetica,sans-serif;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="sysGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.98"/>
    </linearGradient>
    <linearGradient id="ucGradAdmin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="ucGradGuru" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="ucGradSiswa" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
    <linearGradient id="ucGradAI" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.4"/>
    </filter>
    <filter id="glow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#38bdf8" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1600" height="1150" fill="url(#bgGrad)"/>
  
  <!-- Header Banner -->
  <rect x="40" y="25" width="1520" height="90" rx="14" fill="#1e293b" stroke="#334155" stroke-width="2" filter="url(#shadow)"/>
  <text x="70" y="60" fill="#38bdf8" font-size="24" font-weight="bold" letter-spacing="1">USE CASE DIAGRAM — SISTEM UJIAN ONLINE &amp; AI PROCTORING</text>
  <text x="70" y="90" fill="#94a3b8" font-size="14">Proyek Akhir Rekayasa Perangkat Lunak (TIKB2503021) • Mahasiswa: Siti Masripatul Hawa • Tema: E-Learning &amp; Smart Education AI</text>

  <!-- System Boundary Box -->
  <rect x="280" y="140" width="1040" height="970" rx="20" fill="url(#sysGrad)" stroke="#38bdf8" stroke-width="2" stroke-dasharray="8 4" filter="url(#shadow)"/>
  <rect x="300" y="155" width="460" height="34" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
  <text x="315" y="178" fill="#38bdf8" font-size="14" font-weight="bold">«system boundary» AI Online Exam &amp; Proctoring Platform</text>

  <!-- ================= ACTOR: ADMIN ================= -->
  <g transform="translate(60, 240)">
    <circle cx="70" cy="40" r="24" fill="#1e293b" stroke="#38bdf8" stroke-width="3" filter="url(#shadow)"/>
    <line x1="70" y1="64" x2="70" y2="120" stroke="#38bdf8" stroke-width="3"/>
    <line x1="30" y1="85" x2="110" y2="85" stroke="#38bdf8" stroke-width="3"/>
    <line x1="70" y1="120" x2="40" y2="170" stroke="#38bdf8" stroke-width="3"/>
    <line x1="70" y1="120" x2="100" y2="170" stroke="#38bdf8" stroke-width="3"/>
    <rect x="15" y="180" width="110" height="36" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="70" y="198" fill="#f8fafc" font-size="13" font-weight="bold" text-anchor="middle">Administrator</text>
    <text x="70" y="210" fill="#94a3b8" font-size="10" text-anchor="middle">«human actor»</text>
  </g>

  <!-- ================= ACTOR: GURU ================= -->
  <g transform="translate(60, 680)">
    <circle cx="70" cy="40" r="24" fill="#1e293b" stroke="#10b981" stroke-width="3" filter="url(#shadow)"/>
    <line x1="70" y1="64" x2="70" y2="120" stroke="#10b981" stroke-width="3"/>
    <line x1="30" y1="85" x2="110" y2="85" stroke="#10b981" stroke-width="3"/>
    <line x1="70" y1="120" x2="40" y2="170" stroke="#10b981" stroke-width="3"/>
    <line x1="70" y1="120" x2="100" y2="170" stroke="#10b981" stroke-width="3"/>
    <rect x="15" y="180" width="110" height="36" rx="6" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
    <text x="70" y="198" fill="#f8fafc" font-size="13" font-weight="bold" text-anchor="middle">Guru / Penguji</text>
    <text x="70" y="210" fill="#94a3b8" font-size="10" text-anchor="middle">«human actor»</text>
  </g>

  <!-- ================= ACTOR: SISWA ================= -->
  <g transform="translate(1420, 240)">
    <circle cx="70" cy="40" r="24" fill="#1e293b" stroke="#a855f7" stroke-width="3" filter="url(#shadow)"/>
    <line x1="70" y1="64" x2="70" y2="120" stroke="#a855f7" stroke-width="3"/>
    <line x1="30" y1="85" x2="110" y2="85" stroke="#a855f7" stroke-width="3"/>
    <line x1="70" y1="120" x2="40" y2="170" stroke="#a855f7" stroke-width="3"/>
    <line x1="70" y1="120" x2="100" y2="170" stroke="#a855f7" stroke-width="3"/>
    <rect x="15" y="180" width="110" height="36" rx="6" fill="#1e293b" stroke="#a855f7" stroke-width="1.5"/>
    <text x="70" y="198" fill="#f8fafc" font-size="13" font-weight="bold" text-anchor="middle">Siswa / Peserta</text>
    <text x="70" y="210" fill="#94a3b8" font-size="10" text-anchor="middle">«human actor»</text>
  </g>

  <!-- ================= ACTOR: AI SYSTEM ================= -->
  <g transform="translate(1415, 680)">
    <rect x="25" y="15" width="90" height="80" rx="12" fill="#1e293b" stroke="#f59e0b" stroke-width="3" filter="url(#shadow)"/>
    <!-- CPU chip icon -->
    <rect x="45" y="35" width="50" height="40" rx="4" fill="#0f172a" stroke="#f59e0b" stroke-width="1.5"/>
    <circle cx="70" cy="55" r="8" fill="#f59e0b"/>
    <line x1="35" y1="45" x2="45" y2="45" stroke="#f59e0b" stroke-width="2"/>
    <line x1="35" y1="65" x2="45" y2="65" stroke="#f59e0b" stroke-width="2"/>
    <line x1="95" y1="45" x2="105" y2="45" stroke="#f59e0b" stroke-width="2"/>
    <line x1="95" y1="65" x2="105" y2="65" stroke="#f59e0b" stroke-width="2"/>
    <rect x="10" y="110" width="120" height="48" rx="6" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="70" y="130" fill="#f8fafc" font-size="12" font-weight="bold" text-anchor="middle">AI Engine</text>
    <text x="70" y="145" fill="#fcd34d" font-size="10" text-anchor="middle">Proctoring &amp; Chatbot</text>
    <text x="70" y="180" fill="#94a3b8" font-size="10" text-anchor="middle">«automated system»</text>
  </g>

  <!-- ================= USE CASES (ELLIPSES) ================= -->

  <!-- UC-01: Autentikasi -->
  <g transform="translate(700, 200)" filter="url(#shadow)">
    <ellipse cx="100" cy="35" rx="150" ry="32" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <text x="100" y="32" fill="#f8fafc" font-size="13" font-weight="bold" text-anchor="middle">UC-01: Autentikasi &amp; RBAC</text>
    <text x="100" y="48" fill="#94a3b8" font-size="11" text-anchor="middle">(Login BCRYPT, Session &amp; CSRF)</text>
  </g>

  <!-- UC-02: Master Data -->
  <g transform="translate(370, 270)" filter="url(#shadow)">
    <ellipse cx="100" cy="35" rx="140" ry="30" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
    <text x="100" y="32" fill="#f8fafc" font-size="13" font-weight="bold" text-anchor="middle">UC-02: Kelola Master Data</text>
    <text x="100" y="48" fill="#94a3b8" font-size="11" text-anchor="middle">(User, Guru, Siswa, Kelas, Mapel)</text>
  </g>

