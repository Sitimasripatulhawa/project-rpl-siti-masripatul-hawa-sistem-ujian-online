  <g transform="translate(970, 570)" filter="url(#shadow)">
    <ellipse cx="100" cy="35" rx="150" ry="34" fill="#1e293b" stroke="#f59e0b" stroke-width="2.5"/>
    <text x="100" y="30" fill="#f8fafc" font-size="13" font-weight="bold" text-anchor="middle">UC-10: Pengawasan AI Proctoring</text>
    <text x="100" y="46" fill="#fcd34d" font-size="11" text-anchor="middle">(Face Detection, Tab Switch, Risk Score)</text>
  </g>

  <!-- UC-11: Chatbot Siswa / Explainer -->
  <g transform="translate(970, 710)" filter="url(#shadow)">
    <ellipse cx="100" cy="35" rx="140" ry="30" fill="#1e293b" stroke="#8b5cf6" stroke-width="2"/>
    <text x="100" y="32" fill="#f8fafc" font-size="13" font-weight="bold" text-anchor="middle">UC-11: Chatbot Bantuan Akademik</text>
    <text x="100" y="48" fill="#94a3b8" font-size="11" text-anchor="middle">(Panduan Teknis &amp; Pembahasan Soal)</text>
  </g>

  <!-- UC-12: Reset Password via SMTP -->
  <g transform="translate(700, 950)" filter="url(#shadow)">
    <ellipse cx="100" cy="35" rx="140" ry="30" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <text x="100" y="32" fill="#f8fafc" font-size="13" font-weight="bold" text-anchor="middle">UC-12: Reset Password &amp; Token</text>
    <text x="100" y="48" fill="#94a3b8" font-size="11" text-anchor="middle">(Notifikasi Email SMTP Gmail)</text>
  </g>

  <!-- ================= ASSOCIATIONS / LINES ================= -->

  <!-- Admin Lines -->
  <line x1="180" y1="340" x2="700" y2="235" stroke="#38bdf8" stroke-width="1.8"/>
  <line x1="180" y1="340" x2="370" y2="305" stroke="#38bdf8" stroke-width="1.8"/>
  <line x1="180" y1="340" x2="370" y2="405" stroke="#38bdf8" stroke-width="1.8"/>
  <line x1="180" y1="340" x2="370" y2="505" stroke="#38bdf8" stroke-width="1.8"/>
  <line x1="180" y1="340" x2="370" y2="855" stroke="#38bdf8" stroke-width="1.8"/>

  <!-- Guru Lines -->
  <line x1="180" y1="780" x2="700" y2="235" stroke="#10b981" stroke-width="1.8"/>
  <line x1="180" y1="780" x2="370" y2="655" stroke="#10b981" stroke-width="1.8"/>
  <line x1="180" y1="780" x2="370" y2="755" stroke="#10b981" stroke-width="1.8"/>
  <line x1="180" y1="780" x2="370" y2="855" stroke="#10b981" stroke-width="1.8"/>

  <!-- Siswa Lines -->
  <line x1="1420" y1="340" x2="900" y2="235" stroke="#a855f7" stroke-width="1.8"/>
  <line x1="1420" y1="340" x2="1250" y2="345" stroke="#a855f7" stroke-width="1.8"/>
  <line x1="1420" y1="340" x2="1260" y2="465" stroke="#a855f7" stroke-width="1.8"/>
  <line x1="1420" y1="340" x2="1250" y2="745" stroke="#a855f7" stroke-width="1.8"/>

  <!-- AI System Lines -->
  <line x1="1415" y1="760" x2="1270" y2="605" stroke="#f59e0b" stroke-width="2"/>
  <line x1="1415" y1="760" x2="1250" y2="745" stroke="#f59e0b" stroke-width="2"/>
  <line x1="1415" y1="760" x2="650" y2="505" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- Relationship: <<include>> UC-09 includes UC-01 & UC-08 -->
  <path d="M 1070 430 Q 1020 330 890 240" fill="none" stroke="#e2e8f0" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="960" y="320" fill="#cbd5e1" font-size="10" font-style="italic">«include»</text>

  <path d="M 1070 430 L 1070 380" fill="none" stroke="#e2e8f0" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="1080" y="405" fill="#cbd5e1" font-size="10" font-style="italic">«include»</text>

  <!-- Relationship: <<include>> UC-09 includes UC-10 -->
  <path d="M 1070 495 L 1070 570" fill="none" stroke="#f59e0b" stroke-width="2" stroke-dasharray="5 3"/>
  <text x="1080" y="535" fill="#fcd34d" font-size="11" font-weight="bold">«include»</text>

  <!-- Relationship: <<extend>> UC-10 extends UC-06 (Alerting Fraud) -->
  <path d="M 970 605 Q 670 660 650 730" fill="none" stroke="#ef4444" stroke-width="1.8" stroke-dasharray="5 3"/>
  <text x="730" y="655" fill="#f87171" font-size="11" font-weight="bold">«extend» (Risk Alert)</text>

  <!-- Relationship: <<include>> UC-07 includes UC-09 -->
  <path d="M 650 840 Q 820 680 970 480" fill="none" stroke="#e2e8f0" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="770" y="620" fill="#cbd5e1" font-size="10" font-style="italic">«include»</text>

  <!-- Footer Legend -->
  <g transform="translate(60, 1070)">
    <rect width="1480" height="45" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <circle cx="30" cy="22" r="6" fill="#38bdf8"/>
    <text x="45" y="27" fill="#cbd5e1" font-size="12">Admin Associations</text>
    <circle cx="210" cy="22" r="6" fill="#10b981"/>
    <text x="225" y="27" fill="#cbd5e1" font-size="12">Guru Associations</text>
    <circle cx="380" cy="22" r="6" fill="#a855f7"/>
    <text x="395" y="27" fill="#cbd5e1" font-size="12">Siswa Associations</text>
    <circle cx="560" cy="22" r="6" fill="#f59e0b"/>
    <text x="575" y="27" fill="#cbd5e1" font-size="12">AI Engine Interactions</text>
    <line x1="750" y1="22" x2="800" y2="22" stroke="#e2e8f0" stroke-width="2" stroke-dasharray="4 3"/>
    <text x="810" y="27" fill="#cbd5e1" font-size="12">«include» / «extend» Dependency</text>
    <text x="1230" y="27" fill="#94a3b8" font-size="12">Standar UML 2.5 • STMIK IKMI Cirebon</text>
  </g>
</svg>