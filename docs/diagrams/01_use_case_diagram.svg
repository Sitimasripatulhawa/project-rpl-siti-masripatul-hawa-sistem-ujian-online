  <g transform="translate(370, 620)" filter="url(#shadow)">
    <ellipse cx="100" cy="35" rx="140" ry="30" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
    <text x="100" y="32" fill="#f8fafc" font-size="13" font-weight="bold" text-anchor="middle">UC-05: Bank Soal &amp; Paket Ujian</text>
    <text x="100" y="48" fill="#94a3b8" font-size="11" text-anchor="middle">(CRUD Soal, Opsi, Bobot, Jadwal)</text>
  </g>

  <!-- UC-06: Monitoring Ujian Real-Time -->
  <g transform="translate(370, 720)" filter="url(#shadow)">
    <ellipse cx="100" cy="35" rx="140" ry="30" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
    <text x="100" y="32" fill="#f8fafc" font-size="13" font-weight="bold" text-anchor="middle">UC-06: Live Monitoring Ujian</text>
    <text x="100" y="48" fill="#94a3b8" font-size="11" text-anchor="middle">(Pantau Status Siswa &amp; Proctoring)</text>
  </g>

  <!-- UC-07: Penilaian & Analitik -->
  <g transform="translate(370, 820)" filter="url(#shadow)">
    <ellipse cx="100" cy="35" rx="140" ry="30" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
    <text x="100" y="32" fill="#f8fafc" font-size="13" font-weight="bold" text-anchor="middle">UC-07: Penilaian &amp; Analitik</text>
    <text x="100" y="48" fill="#94a3b8" font-size="11" text-anchor="middle">(Koreksi Otomatis, Rekap &amp; Ekspor)</text>
  </g>

  <!-- UC-08: System Check WebRTC -->
  <g transform="translate(970, 310)" filter="url(#shadow)">
    <ellipse cx="100" cy="35" rx="140" ry="30" fill="#1e293b" stroke="#8b5cf6" stroke-width="2"/>
    <text x="100" y="32" fill="#f8fafc" font-size="13" font-weight="bold" text-anchor="middle">UC-08: Cek Kesiapan Sistem</text>
    <text x="100" y="48" fill="#94a3b8" font-size="11" text-anchor="middle">(Izin WebRTC Kamera &amp; Layar Penuh)</text>
  </g>

  <!-- UC-09: Ruang Ujian & Auto-Save -->
  <g transform="translate(970, 430)" filter="url(#shadow)">
    <ellipse cx="100" cy="35" rx="145" ry="32" fill="#1e293b" stroke="#8b5cf6" stroke-width="2"/>
    <text x="100" y="32" fill="#f8fafc" font-size="13" font-weight="bold" text-anchor="middle">UC-09: Kerjakan Ujian Online</text>
    <text x="100" y="48" fill="#94a3b8" font-size="11" text-anchor="middle">(Timer, Navigasi Soal, Auto-Save)</text>
  </g>

