    <text x="100" y="32" fill="#f8fafc" font-size="13" font-weight="bold" text-anchor="middle">UC-04: Chatbot Asisten Admin</text>
    <text x="100" y="48" fill="#94a3b8" font-size="11" text-anchor="middle">(Kueri Cepat Metrik Peserta &amp; Ujian)</text>
