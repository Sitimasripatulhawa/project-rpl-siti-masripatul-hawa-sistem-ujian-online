    <ellipse cx="100" cy="35" rx="140" ry="30" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
    <text x="100" y="32" fill="#f8fafc" font-size="13" font-weight="bold" text-anchor="middle">UC-03: Pengaturan &amp; SMTP</text>
    <text x="100" y="48" fill="#94a3b8" font-size="11" text-anchor="middle">(Config System, Email PHPMailer)</text>
  </g>

